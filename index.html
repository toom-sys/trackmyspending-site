<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metriqs</title>
  <meta name="description" content="Metriqs — Woodland Atlas. Select GB woodland from open data and see its indicative value." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f1412;
      --ink-soft: #3a4540;
      --paper: #f4f7f4;
      --line: #c5d0c8;
      --accent: #1f6b4a;
      --accent-deep: #0f3d2c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: Outfit, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 700px at 12% -10%, rgba(31, 107, 74, 0.18), transparent 55%),
        radial-gradient(900px 600px at 90% 10%, rgba(155, 196, 174, 0.35), transparent 50%),
        linear-gradient(165deg, #eef3ef 0%, var(--paper) 45%, #e2ebe4 100%);
      background-attachment: fixed;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 1.25rem clamp(1.25rem, 4vw, 3rem) 1.5rem;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
      text-decoration: none;
    }

    main {
      display: grid;
      align-content: center;
      justify-items: start;
      max-width: 42rem;
      padding: clamp(3rem, 12vh, 7rem) 0 clamp(2rem, 6vh, 4rem);
    }

    .kicker {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    h1 {
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      max-width: 14ch;
    }

    .lede {
      font-size: 1.125rem;
      line-height: 1.55;
      color: var(--ink-soft);
      max-width: 34ch;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      background: var(--accent);
      color: #f4faf6;
      transition: transform 160ms ease, background 160ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: var(--accent-deep);
    }

    .note {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    footer {
      font-size: 0.8rem;
      color: var(--ink-soft);
      border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      padding-top: 1rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/">Metriqs</a>
    </header>

    <main>
      <p class="kicker">Woodland Atlas</p>
      <h1>Select woodland. See its value.</h1>
      <p class="lede">Map GB woodland from open public data, build a selection, and price it with a transparent model.</p>
      <a class="btn" href="/woodlands/">Open Woodland Atlas</a>
      <p class="note">Indicative briefing tool · open data · no account required</p>
    </main>

    <footer>© Metriqs</footer>
  </div>
</body>
</html>
